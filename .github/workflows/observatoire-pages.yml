name: Publier l’observatoire SI-HCPN
on:
  push:
    branches: [main]
    paths: ['observatoire/**', '.github/workflows/observatoire-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: observatoire/package-lock.json
      - run: npm ci
        working-directory: observatoire
      - run: npm test
        working-directory: observatoire
      - run: npm run build
        working-directory: observatoire
      - uses: actions/upload-pages-artifact@v3
        with:
          path: observatoire/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
